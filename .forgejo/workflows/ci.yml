name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Daily, so an advisory published against an unchanged tree reds `main`
  # the next morning rather than the next unrelated pull request. Only
  # `cargo` runs on a schedule; there is nothing new to build an image of.
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # All cargo checks in one job — cache hit + shared incremental state beats
  # one-job-per-check. withings-mcp has no C deps, so no cmake/apt step.
  cargo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }
      # Pin a commit on master, not on `stable`. Forge resolves actions from its
      # own mirrors (DEFAULT_ACTIONS_URL = forge.oddie.app), and dtolnay
      # force-pushes `stable`, so the mirror's 24h sync prunes the old tip and
      # the pin 404s. master/v1 is append-only. It has no default `toolchain`.
      #
      # An exact version, not `stable`. With `RUSTFLAGS: -Dwarnings` a moving
      # stable means the next clippy release fires a new lint on untouched code
      # and reds whatever pull request happens to be open, and each `#[allow]`
      # added to quiet one raises the version below which nobody can lint the
      # tree at all — silently, because CI is always on the new side of it.
      # Bump this deliberately, in its own change, and read AGENTS.md first.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --all-features --locked
      - name: audit
        run: |
          [ -x ~/.cargo/bin/cargo-audit ] || cargo install --locked cargo-audit
          cargo audit
      - name: OSV dependency audit
        env:
          OSV_SCANNER_VERSION: 2.5.1
          OSV_SCANNER_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          set -euo pipefail
          binary="$(mktemp)"
          trap 'rm -f "$binary"' EXIT
          curl --fail --location --silent --show-error -o "$binary" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${binary}" | sha256sum -c -
          chmod +x "$binary"
          "$binary" scan source --lockfile Cargo.lock
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1  # v2
        with: { command: check bans licenses sources }

  # buildctl talks to Pada's buildkitd over TCP. Registry-backed layer cache.
  docker:
    runs-on: ubuntu-22.04
    needs: cargo
    # Daily source audits must not build or export the main cache.
    if: github.event_name != 'schedule'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install buildctl
        env:
          BUILDKIT_VERSION: v0.30.0
          BUILDKIT_SHA256: 2da148c50540409988c837e62b72176e4a9ad7855548a2dd6ea1cd0c0d2d360d
        run: |
          set -euo pipefail
          TARBALL="/tmp/buildkit.tar.gz"
          curl -sSL -o "$TARBALL" \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          echo "${BUILDKIT_SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local --strip-components=0 -f "$TARBALL"
          rm -f "$TARBALL"
          buildctl --version
      - name: Install SBOM and vulnerability scanners
        env:
          SYFT_VERSION: 1.51.0
          SYFT_SHA256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          SYFT_TARBALL="/tmp/syft.tar.gz"
          TRIVY_TARBALL="/tmp/trivy.tar.gz"
          curl -sSL -o "$SYFT_TARBALL" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$TRIVY_TARBALL" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${SYFT_SHA256}  ${SYFT_TARBALL}" | sha256sum -c -
          echo "${TRIVY_SHA256}  ${TRIVY_TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$SYFT_TARBALL" syft
          sudo tar -xz -C /usr/local/bin -f "$TRIVY_TARBALL" trivy
          rm -f "$SYFT_TARBALL" "$TRIVY_TARBALL"
          syft version
          trivy --version
      - name: Install digest-preserving OCI copier
        env:
          REGCTL_VERSION: v0.11.7
          REGCTL_SHA256: 3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc
        run: |
          set -euo pipefail
          binary="$(mktemp)"
          trap 'rm -f "$binary"' EXIT
          curl --fail --location --silent --show-error -o "$binary" \
            "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
          echo "${REGCTL_SHA256}  ${binary}" | sha256sum -c -
          sudo install -m 0755 "$binary" /usr/local/bin/regctl
          regctl version
      - name: Login to Forgejo registry
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.docker
          F_AUTH=$(printf "%s:%s" "jlxq0" "${{ secrets.FORGE_PUSH_TOKEN }}" | base64 -w0)
          echo "{\"auths\":{\"forge.oddie.app\":{\"auth\":\"$F_AUTH\"}}}" > ~/.docker/config.json
      - name: Build, scan, attest, and push on tag
        run: |
          set -euo pipefail
          GW="$(node -e 'const fs=require("fs");for(const l of fs.readFileSync("/proc/net/route","utf8").split("\n").slice(1)){const f=l.trim().split(/\s+/);if(f[1]==="00000000"){const h=f[2];console.log([h.slice(6,8),h.slice(4,6),h.slice(2,4),h.slice(0,2)].map(x=>parseInt(x,16)).join("."));break;}}')"
          export BUILDKIT_HOST="tcp://${GW}:1234"
          echo "buildkitd at ${BUILDKIT_HOST}"
          CACHE_REF="forge.oddie.app/jlxq0/withings-mcp:buildcache"
          LOCAL_TAG="withings-mcp:ci-${GITHUB_SHA::8}"
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$VERSION"
            git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "${GITHUB_REF}^{commit}" origin/main
          fi
          IMPORT_CACHE_ARG=(--import-cache "type=registry,ref=${CACHE_REF}")
          EXPORT_CACHE_ARG=()
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            EXPORT_CACHE_ARG=(--export-cache "type=registry,ref=${CACHE_REF},mode=max")
          fi

          # Solve once, including attestations; scan and publish these exact bytes.
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --opt platform=linux/amd64 \
            --opt "build-arg:APP_VERSION=${VERSION}" \
            --opt "build-arg:VCS_REF=${GITHUB_SHA}" \
            "${IMPORT_CACHE_ARG[@]}" \
            "${EXPORT_CACHE_ARG[@]}" \
            --opt attest:provenance=mode=max \
            --opt attest:sbom= \
            --metadata-file /tmp/withings-mcp-build-metadata.json \
            --output "type=oci,dest=/tmp/withings-mcp.oci.tar,name=${LOCAL_TAG}"

          mkdir -p /tmp/withings-mcp.oci
          tar -xf /tmp/withings-mcp.oci.tar -C /tmp/withings-mcp.oci
          trivy image --input /tmp/withings-mcp.oci \
            --severity HIGH,CRITICAL --exit-code 1
          trivy config . --severity HIGH,CRITICAL --exit-code 1
          syft "oci-archive:/tmp/withings-mcp.oci.tar" \
            -o cyclonedx-json=withings-mcp.cdx.json
          test -s withings-mcp.cdx.json

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            DIGEST="$(jq -e -r '."containerimage.digest"' /tmp/withings-mcp-build-metadata.json)"
            bash scripts/publish_oci.sh /tmp/withings-mcp.oci "$DIGEST" \
              forge.oddie.app/jlxq0/withings-mcp "${GITHUB_REF#refs/tags/}"
          fi
